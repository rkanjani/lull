# Runs both apps' tests on every pull request, so a change that breaks either platform is caught
# before it reaches main (and the store workflows).
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Test BedJetKit
        working-directory: BedJetKit
        run: swift test
      # The app's own tests need a simulator, so they run locally; this catches a change that breaks the iPhone app,
      # its widgets or the watch app before it reaches the release workflow.
      - name: Build the app, widgets and watch app
        run: xcodebuild build -project Lull.xcodeproj -scheme Lull -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test BedJetKit, the app and the watch app, and build both variants of each
        working-directory: android
        run: ./gradlew :bedjetkit:test :app:testDebugUnitTest :wear:testDebugUnitTest :app:assembleDebug :app:assembleRelease :wear:assembleDebug :wear:assembleRelease
